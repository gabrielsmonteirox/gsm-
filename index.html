<title>Diagnóstico de Atendimento · Natus Farma</title>
<style>
:root{
  --blue:#008AC6; --blue-d:#0A6EA3; --blue-dd:#135E8E; --blue-w:#E7F3FA; --blue-ww:#F3F9FC;
  --red:#CF2727; --red-w:#FCECEC; --amber:#A86400; --amber-w:#FFF5E2; --amber-l:#E9A23B; --green:#1E8A4C; --green-w:#E8F6EE;
  --bg:#F3F6F9; --panel:#FFFFFF; --text:#1E2935; --muted:#617080; --line:#DDE5EC; --line2:#EEF2F6;
  --radius:14px; --shadow:0 1px 2px rgba(16,40,64,.06),0 4px 14px rgba(16,40,64,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.brandbar{height:5px;background:linear-gradient(90deg,var(--blue) 0%,#329CCE 68%,var(--red) 68%,var(--red) 100%)}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
header.top img{height:40px;width:auto;display:block}
header.top .sep{width:1px;align-self:stretch;background:var(--line)}
header.top .kick{color:var(--red);letter-spacing:2.5px;font-size:10.5px;font-weight:600;text-transform:uppercase}
header.top h1{margin:0;color:var(--blue-dd);font-size:19px;font-weight:600;letter-spacing:-.2px;line-height:1.2}
/* ---------- barra da visita ---------- */
.vbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(16,40,64,.05)}
.vbar .r1{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px 2px}
.vbar .who{flex:1;min-width:0}
.vbar .who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--blue-dd)}
.vbar .who span{font-size:12px;color:var(--muted)}
.vbar .who span.err{color:var(--red);font-weight:600}
.ibtn{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:var(--blue-dd)}
.steps{max-width:760px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:6px 10px 8px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;min-width:62px;padding:5px 9px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;line-height:1.15}
.chip .cl{font-size:12.5px;font-weight:600;white-space:nowrap}
.chip .cs{font-size:11px;color:var(--muted);white-space:nowrap}
.chip.now{border-color:var(--blue);background:var(--blue);color:#fff}.chip.now .cs{color:#E7F3FA}
.chip.done:not(.now){border-color:#9AD3B0}.chip.done:not(.now) .cs{color:var(--green)}
.chip.crit:not(.now) .cs{color:var(--red);font-weight:700}.chip.melh:not(.now) .cs{color:var(--amber);font-weight:700}.chip.bem:not(.now) .cs{color:var(--green);font-weight:700}
.chip:disabled{opacity:.45;cursor:default}
/* ---------- conteúdo ---------- */
.wrap{max-width:760px;margin:0 auto;padding:6px 16px 170px}
.wrap.semnav{padding-bottom:40px}
h2{font-size:20px;margin:18px 0 6px;color:var(--blue-dd)}
h3{font-size:16px;margin:0 0 6px;color:var(--blue-dd)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin:10px 0}
.lab{display:block;font-size:12px;font-weight:600;color:var(--blue-dd);text-transform:uppercase;letter-spacing:.6px;margin:0 0 6px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--blue-ww);min-height:48px}
textarea{resize:none;line-height:1.4;overflow:hidden}
input:focus,select:focus,textarea:focus{outline:3px solid var(--blue-w);border-color:var(--blue)}
input:disabled,select:disabled,textarea:disabled{background:var(--line2);color:var(--text);opacity:1;-webkit-text-fill-color:var(--text)}
.auto{display:flex;gap:10px}
.auto>div{flex:1;background:var(--line2);border-radius:10px;padding:8px 12px}
.auto b{display:block;font-size:20px;color:var(--blue-dd)}
.auto span{font-size:12px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:600;text-decoration:none;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.okb{border-color:#9AD3B0;color:var(--green);background:var(--green-w)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--amber-w);border:1px solid #F1D9A8;border-radius:11px;padding:10px 13px;margin:10px 0;font-size:14px}
.note.info{background:var(--blue-ww);border-color:#B9DCEE}
.note.ok{background:var(--green-w);border-color:#9AD3B0}
.note.err{background:var(--red-w);border-color:#F1C2C2}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:#fff;margin:10px 0}
/* ---------- classificação ---------- */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.badge.aguard{background:var(--line2);color:var(--muted)}
.badge.crit{background:var(--red-w);color:var(--red)}
.badge.melh{background:var(--amber-w);color:var(--amber)}
.badge.bem{background:var(--green-w);color:var(--green)}
.c-crit{color:var(--red)}.c-melh{color:var(--amber)}.c-bem{color:var(--green)}.c-aguard{color:var(--muted)}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px}
.legend b.c1{color:var(--red)}.legend b.c2{color:var(--amber)}.legend b.c3{color:var(--green)}
/* ---------- etapa ---------- */
.ehead{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin:12px 0}
.ehead .kick{font-size:11.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red)}
.ehead h2{margin:2px 0 6px;font-size:22px}
.ehead .q{font-style:italic;color:var(--text);border-left:3px solid var(--blue);padding:2px 0 2px 10px;margin:6px 0 10px}
.ehead .med{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ehead .med .n{font-size:26px;font-weight:700;line-height:1}
/* ---------- item ---------- */
.item{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px 18px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.item.crit::before{background:var(--red)}.item.melh::before{background:var(--amber-l)}.item.bem::before{background:var(--green)}
.it-h{display:flex;gap:10px;align-items:flex-start}
.it-n{flex:none;font-weight:700;color:var(--blue-dd);min-width:28px}
.it-t{flex:1;font-weight:600;font-size:16px}
.binfo{flex:none;display:grid;place-items:center;width:40px;height:40px;margin:-6px -4px 0 0;border-radius:50%;border:1.5px solid var(--blue);background:var(--blue-ww);color:var(--blue);font:700 17px/1 Georgia,serif;cursor:pointer}
.notas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 10px}
.nb{height:52px;border-radius:12px;border:2px solid;background:#fff;font-size:20px;font-weight:700;cursor:pointer;padding:0}
.nb.r1{border-color:#F1C2C2;color:var(--red)}.nb.r2{border-color:#F1D9A8;color:var(--amber)}.nb.r3{border-color:#9AD3B0;color:var(--green)}
.nb.on.r1{background:var(--red);border-color:var(--red);color:#fff}
.nb.on.r2{background:var(--amber-l);border-color:var(--amber-l);color:#fff}
.nb.on.r3{background:var(--green);border-color:var(--green);color:#fff}
.nb:disabled{cursor:default}
.nb:disabled:not(.on){opacity:.4}
.abre{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;min-height:42px;border:1.5px dashed #B9CCDA;border-radius:11px;background:var(--blue-ww);color:var(--blue-dd);font-size:14px;font-weight:600;cursor:pointer;padding:6px 10px}
.abre span{color:#9FB3C4}
.item{scroll-margin-top:130px}
.it-st{display:flex;align-items:center;gap:8px;min-height:36px;margin-bottom:8px}
.it-st .btn{margin-left:auto}
.plin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--muted)}
.plin .btn{min-height:38px}
.plin.on{color:var(--blue-dd);font-weight:600}
/* ---------- fotos ---------- */
.fbtns{display:flex;gap:8px;margin-top:10px}
.fbtns .btn{flex:1}
.fgrid{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.ft{display:flex;gap:10px;align-items:flex-start;background:var(--blue-ww);border:1px solid var(--line);border-radius:12px;padding:8px}
.ft .thumb{flex:none;position:relative;width:96px;height:96px;cursor:zoom-in}
.ft img{width:96px;height:96px;object-fit:cover;border-radius:8px;background:var(--line2);display:block}
.ft .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:15px;pointer-events:none}
.fbtns .btn{padding:10px 8px;gap:6px}
.ft .fm{flex:1;min-width:0}
.ft .fts{font-size:12.5px;font-weight:600;color:var(--blue-dd)}
.ft .fts small{font-weight:400;color:var(--muted)}
.ft textarea{min-height:44px;font-size:15px;padding:8px 10px;margin-top:4px;background:#fff}
.ft .fdel{margin-top:6px}
.fproc{font-size:13px;color:var(--muted);padding:6px 2px}
/* ---------- plano ---------- */
.pcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 18px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.pcard.crit::before{background:var(--red)}.pcard.melh::before{background:var(--amber-l)}.pcard.bem::before{background:var(--green)}
.pcard .ptopo{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0;cursor:pointer;color:var(--text)}
.pcard .ptopo .seta{margin-left:auto;color:var(--blue-dd);transition:transform .2s}
.pcard.aberto .ptopo .seta{transform:rotate(180deg)}
.pcard .pt{margin-bottom:6px}
.presumo{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted)}
.presumo .pf{color:var(--amber);font-weight:600}
.presumo .pok{color:var(--green);font-weight:700}
.pcorpo{margin-top:12px;border-top:1px solid var(--line2);padding-top:12px}
.pcard .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.pcard .pt{font-weight:600;margin-bottom:10px}
.tag{font-size:11.5px;font-weight:600;color:var(--blue-dd);background:var(--blue-w);border-radius:20px;padding:2px 9px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13.5px;cursor:pointer;min-height:34px}
/* ---------- finalizar ---------- */
.big-m{display:flex;align-items:center;gap:14px}
.big-m .n{font-size:44px;font-weight:700;line-height:1}
.erow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.erow:last-child{border-bottom:0}
.erow .en{flex:1;font-weight:600}
.erow .ev{font-weight:700;min-width:34px;text-align:right}
.erow .pior{font-size:11px;font-weight:700;color:var(--red)}
.sig{border:1.5px dashed #B9CCDA;border-radius:12px;background:#fff;position:relative;touch-action:none}
.sig canvas{display:block;width:100%;height:170px;touch-action:none}
.sig .ph{position:absolute;inset:0;display:grid;place-items:center;color:#AAB7C4;pointer-events:none;font-size:14px}
.sig.ro{border-style:solid;background:var(--line2)}
.sig img{display:block;width:100%;height:170px;object-fit:contain}
/* ---------- início ---------- */
.vis{display:flex;flex-direction:column;gap:4px}
.vis .vt{font-weight:700;color:var(--blue-dd)}
.vis .vm{font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.and{background:var(--blue-w);color:var(--blue-d)}.pill.fin{background:var(--green-w);color:var(--green)}.pill.nexp{background:var(--amber-w);color:var(--amber)}.pill.exp{background:var(--line2);color:var(--muted)}
.help ol{margin:4px 0;padding-left:20px}.help li{margin:4px 0}
.help dt{font-weight:700;color:var(--blue-dd);margin-top:10px}.help dd{margin:2px 0 0}
/* ---------- navegação inferior ---------- */
.navbtm{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(16,40,64,.06)}
.navbtm .in{max-width:760px;margin:0 auto;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.navbtm .btn{flex:1;min-height:52px;font-size:16px}
.navbtm .btn.prev{flex:0 0 34%}
.navbtm .faltam{display:block;width:100%;max-width:760px;margin:0 auto;border:0;border-bottom:1px solid #F1D9A8;background:var(--amber-w);color:var(--amber);font-size:13.5px;font-weight:600;padding:7px 16px;cursor:pointer}
body.digitando .navbtm{display:none}
body.digitando #toast{bottom:20px}
.item.pisca{box-shadow:0 0 0 3px var(--amber-l)}
.item{transition:box-shadow .3s}
/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(19,40,60,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.18)}
@media (min-width:600px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h3{font-size:18px;margin:0 0 8px}
.sheet p{margin:6px 0 12px}
.sheet .sb{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sheet .sb .btn{width:100%;min-height:50px}
.sheet .hsec{margin:12px 0}
.sheet .hsec b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--blue-dd);margin-bottom:2px}
.sheet .full{display:block;width:100%;border-radius:10px}
.pick{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.pick button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;cursor:pointer;min-height:48px}
.pick button .pn{font-weight:700;color:var(--blue-dd);min-width:30px}
.pick button .px{flex:1}
.sheet .hora{font-size:22px;font-weight:700;text-align:center;letter-spacing:1px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts button{min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer;padding:6px 8px}
.opts button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.opts button:disabled{cursor:default}
.opts button:disabled:not(.on){opacity:.5}
.pick button.on{border-color:var(--blue);background:var(--blue-w)}
.sheet .busca{position:sticky;top:-18px;z-index:1;width:100%;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px;background:#fff;box-shadow:0 6px 8px -6px rgba(16,40,64,.15)}
.pickbtn{width:100%;display:flex;align-items:center;gap:8px;text-align:left;font-size:16px;font-weight:600;border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px;background:var(--blue-ww);cursor:pointer;color:var(--text)}
.pickbtn span:first-child{flex:1}
.pickbtn.vazio{font-weight:400;color:var(--muted)}
.pickbtn .seta{color:var(--blue-dd)}
.pickbtn:disabled{background:var(--line2);cursor:default}
.ico{display:inline-flex;width:20px;height:20px}
.ico svg{width:100%;height:100%}
.pick h4{margin:12px 0 2px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
/* ---------- rodapé ---------- */
footer.app{margin-top:34px;color:var(--muted);font-size:12.5px;text-align:center}
footer.app .by{font-size:11.5px;opacity:.8;margin-top:2px}
footer.app .btn{margin-top:12px;font-size:14px}
footer.app .tip{font-size:11.5px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--blue-dd);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:70;font-size:14.5px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

/* ============================== utilitários ============================== */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) { if (k == null || k === false || k === '') continue; el.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return el;
}
Object.defineProperty(Element.prototype, 'put', { configurable: true, value: function (...kids) { this.replaceChildren(); for (const k of kids.flat(Infinity)) { if (k == null || k === false || k === '') continue; this.append(k instanceof Node ? k : document.createTextNode(String(k))); } return this; } });
const pad = n => String(n).padStart(2, '0');
const agoraISO = () => new Date().toISOString();
const hojeISO = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtD = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : '—';
const fmtH = iso => { if (!iso) return '—'; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDH = iso => { if (!iso) return '—'; const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDur = (a, b) => { if (!a || !b) return '—'; const m = Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000)); return m >= 60 ? `${Math.floor(m / 60)}h ${pad(m % 60)}min` : `${m} min`; };
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => n == null ? null : Math.round(n * 100) / 100;
const num1 = n => n == null ? '—' : r1(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const somaDias = (iso, d) => { const b = /^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? new Date(iso + 'T12:00:00') : new Date(); b.setDate(b.getDate() + d); return hojeISO(b); };
const novoId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
let toastT = null;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms); }
function autoGrow(t) { t.style.height = 'auto'; t.style.height = Math.max(48, t.scrollHeight + 2) + 'px'; }

function classe(n) { if (n == null) return 'aguard'; const x = r1(n); return x <= 4 ? 'crit' : x <= 7 ? 'melh' : 'bem'; }
const textoClasse = (n, media) => n == null ? (media ? 'Aguardando avaliação' : 'Aguardando nota') : CL[classe(n)].t;

function migrar(v) {

  const b = await obterPDF();
  baixar(b, nomeArq(V, 'pdf')); toast('PDF baixado');
  if (!V.pdf) { V.pdf = true; await salvarAgora(); pdfCache = null; prepararPDF(); }
}
async function compartilharPDF() {
  const pronto = pdfCache && pdfCache.blob;
  const b = await obterPDF();
  const nome = nomeArq(V, 'pdf');
  let arq = null; try { arq = new File([b], nome, { type: 'application/pdf' }); } catch {}
  const pode = arq && navigator.canShare && navigator.share && navigator.canShare({ files: [arq] });
  if (!pode) { baixar(b, nome); toast('Compartilhar não está disponível aqui. O PDF foi baixado.', 4000); return; }
  const dados = { files: [arq], title: 'Diagnóstico de Atendimento', text: `Diagnóstico de Atendimento · F${V.filial} ${V.lojaNome} · ${fmtD(V.data)}` };
  const enviar = async () => { try { await navigator.share(dados); return true; } catch (e) { if (e && e.name === 'AbortError') return true; if (e && e.name === 'NotAllowedError') return false; baixar(b, nome); toast('Não foi possível compartilhar. O PDF foi baixado.', 4000); return true; } };
  let ok = await enviar();
  if (!ok && !pronto) {
    // o celular exige um toque logo antes de abrir o compartilhamento
    const r = await modal({ titulo: 'PDF pronto', texto: 'Toque para abrir o compartilhamento.', botoes: [{ t: '↗ Compartilhar agora', v: 1, cls: 'primary' }, { t: 'Cancelar', v: 0, cls: 'ghost' }] });
    if (r) ok = await enviar();
  }
  if (!ok) { baixar(b, nome); toast('O PDF foi baixado.', 3000); }
}
function videosDa(v) {
  const out = [];
  for (const x of mapaItens(v).values()) itemSt(v, x.i.id).fotos.filter(ehVideo).forEach((f, k) => out.push({ f, num: x.num, k }));
  return out;
}
async function compartilharVideos() {
  const lista = videosDa(V);
  if (!lista.length) return;
  toast('Preparando vídeos…', 6000);
  const arqs = [];
  for (const { f, num, k } of lista) {
    const b = await fotoGet(f.id); if (!b) continue;
    const nome = `Video_F${V.filial}_${V.data}_item${num}${k ? '_' + (k + 1) : ''}.${extVideo(f.mime || b.type)}`;
    try { arqs.push(new File([b], nome, { type: f.mime || b.type || 'video/mp4' })); } catch { arqs.push(Object.assign(b, { name: nome })); }
  }
  if (!arqs.length) { toast('Vídeos indisponíveis neste celular.'); return; }
  const mb = arqs.reduce((a, x) => a + x.size, 0) / 1048576;
  const baixarTodos = () => { arqs.forEach((a, i) => setTimeout(() => baixar(a, a.name), i * 400)); toast(`${arqs.length} vídeo(s) baixado(s).`); };
  const pode = navigator.canShare && navigator.share && (() => { try { return navigator.canShare({ files: arqs }); } catch { return false; } })();
  if (!pode) {
    const r = await modal({ titulo: 'Compartilhar não disponível', texto: `Este navegador não compartilha estes vídeos (${mb.toFixed(1).replace('.', ',')} MB). Quer baixar os arquivos?`, botoes: [{ t: '⇩ Baixar vídeos', v: 1, cls: 'primary' }, { t: 'Cancelar', v: 0, cls: 'ghost' }] });
    if (r) baixarTodos();
    return;
  }
  // o celular exige um toque logo antes de abrir o compartilhamento
  const r = await modal({ titulo: `${arqs.length} vídeo(s) pronto(s)`, texto: `Total de ${mb.toFixed(1).replace('.', ',')} MB.`, botoes: [{ t: '↗ Compartilhar agora', v: 1, cls: 'primary' }, { t: 'Cancelar', v: 0, cls: 'ghost' }] });
  if (!r) return;
  try { await navigator.share({ files: arqs, title: 'Vídeos do diagnóstico', text: `Vídeos do Diagnóstico de Atendimento · F${V.filial} ${V.lojaNome} · ${fmtD(V.data)}` }); }
  catch (e) { if (!e || e.name !== 'AbortError') { const r2 = await modal({ titulo: 'Não foi possível compartilhar', texto: 'Quer baixar os vídeos no celular?', botoes: [{ t: '⇩ Baixar vídeos', v: 1, cls: 'primary' }, { t: 'Cancelar', v: 0, cls: 'ghost' }] }); if (r2) baixarTodos(); } }
}

/* ============================== rodapé ============================== */
function rodapeApp() {
  return h('footer', { class: 'app' },
    h('div', null, `Natus Farma · Diagnóstico de Atendimento · versão ${VERSAO}`),
    h('div', { class: 'by' }, 'Elaborado por Gabriel da Silva Monteiro'));
}

/* ============================== início do app ============================== */
async function iniciarApp() {
  try { db = await idbAbrir(); } catch { db = null; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  const id = lsGet(LS_ATUAL, null);
  let v = null;
  if (id && db) { try { v = await idb.get('visitas', id); } catch {} }
  const copia = lsGet(LS_COPIA, null);
  if (copia && copia.id === id && (!v || (copia.atualizadoEm || '') > (v.atualizadoEm || ''))) v = copia;
  if (v) {
    V = migrar(v);
    let t = V.tela || 'dados'; if (!TELAS.includes(t) || (V.status === 'rascunho' && t !== 'dados')) t = 'dados';
    if (V.status === 'finalizada') t = 'fim';
    UI.tela = t;
    if (db) salvarAgora();
  }
  try { history.replaceState({ tela: UI.tela }, ''); } catch {}
  render();
  // "Adicionar à tela inicial" e uso sem internet: só quando hospedado (GitHub Pages)
  if (/^https?:$/.test(location.protocol)) {
    document.head.append(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }));
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
iniciarApp();
